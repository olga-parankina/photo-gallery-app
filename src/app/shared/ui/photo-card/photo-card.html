<!-- Two sibling buttons (a button inside a button is invalid HTML); the heart sits on top visually.
     After the heart is used it disappears, so focus moves to the tile instead of being lost. -->
<div class="card">
  <button
    #tile
    type="button"
    class="tile"
    [attr.aria-label]="label()"
    [attr.aria-disabled]="favorite() || null"
    (click)="selected.emit(photo())"
  >
    @if (failed()) {
      <span class="placeholder">Image unavailable</span>
    } @else {
      <img
        [src]="src()"
        alt=""
        width="200"
        height="300"
        loading="lazy"
        (error)="failed.set(true)"
      />
    }
  </button>
  @if (favorite()) {
    <button
      type="button"
      class="badge"
      aria-label="Remove from favorites"
      (click)="unfavorite.emit(photo()); tile.focus()"
    >
      <mat-icon fontSet="material-symbols-outlined" aria-hidden="true">favorite</mat-icon>
    </button>
  }
</div>
