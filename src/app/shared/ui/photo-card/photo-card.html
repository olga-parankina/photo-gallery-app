<!-- Two sibling buttons (a button inside a button is invalid HTML); the heart sits on top visually. -->
<div class="card">
  <button type="button" class="tile" [attr.aria-label]="label()" (click)="selected.emit(photo())">
    @if (failed()) {
      <span class="placeholder">Image unavailable</span>
    } @else {
      <img
        [src]="src()"
        alt=""
        width="200"
        height="300"
        loading="lazy"
        (error)="failed.set(true)"
      />
    }
  </button>
  @if (favorite()) {
    <button
      type="button"
      class="badge"
      aria-label="Remove from favorites"
      (click)="unfavorite.emit(photo())"
    >
      <mat-icon fontSet="material-symbols-outlined" aria-hidden="true">favorite</mat-icon>
    </button>
  }
</div>
